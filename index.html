<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AEC Wallet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable prototype of the Arabian Exchange Company digital wallet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>/* AEC Wallet · "Desert Glass" — white + AEC green glass over a living mint aurora.
   Layout: desktop = phone frame centred, story column left, presenter panel right; phone = full-screen app. */
:root{
  --g950:#05261a; --g900:#0A3D2A; --g800:#0E5A3C; --g700:#13734B; --g600:#1F9A5C; --g500:#2DB36E; --g300:#8FD9B0; --g100:#DDF3E7;
  --mint:#EAF7F0; --mint2:#F5FBF8; --white:#FFFFFF;
  --ink:#0F2A20; --ink2:#4A6357; --ink3:#7A9187; --line:rgba(15,42,32,.09);
  --sand:#C8963E; --sand-ink:#7A4E0E; --sand-bg:#FBF1DE;
  --danger:#B42318; --danger-bg:#FDECEA; --warn:#9A5B00; --warn-bg:#FFF4DC;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.78);
  --shadow:0 12px 32px -14px rgba(10,61,42,.28);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --f-latin:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-ui:var(--f-latin);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--g950);color:var(--ink);font-family:var(--f-latin);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--g500);outline-offset:2px;border-radius:10px}

/* ---------- Stage (desktop) ---------- */
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(260px,1fr);align-items:center;gap:40px;padding:20px 32px;
  background:
    radial-gradient(1200px 700px at 15% 10%, rgba(45,179,110,.35), transparent 60%),
    radial-gradient(900px 600px at 90% 90%, rgba(31,154,92,.30), transparent 60%),
    radial-gradient(700px 500px at 60% 30%, rgba(200,150,62,.10), transparent 60%),
    var(--g950);}
.stage::before{content:"";position:absolute;inset:0;background-image:var(--pattern-dark);background-size:96px 96px;opacity:.5;pointer-events:none}
.story{position:relative;color:#E6F5EC;max-width:340px;justify-self:end}
.story .logo-full{width:260px;height:auto;display:block;margin-bottom:28px}
.story h1{font-size:30px;line-height:1.15;margin:0 0 12px;font-weight:700;letter-spacing:-.02em;text-wrap:balance;color:#fff}
.story p{margin:0 0 18px;color:#A9CDB9;line-height:1.55;font-size:14px}
.story .chips{display:flex;flex-wrap:wrap;gap:8px}
.story .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:#CFE8DA;background:rgba(255,255,255,.05)}
.story .by{margin-top:26px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7FB197}

.phone-wrap{position:relative;width:390px;height:844px;transform-origin:center center}
.phone{position:absolute;inset:-12px;border-radius:62px;background:linear-gradient(145deg,#1d2622,#070a09 60%,#1b2420);box-shadow:0 40px 90px -20px rgba(0,0,0,.6),0 0 0 1.5px #2c3a33 inset,0 0 0 3px #0a0d0c;padding:12px}
.phone .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:60}
.app{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--mint2);isolation:isolate}

/* ---------- Presenter ---------- */
.presenter{position:relative;justify-self:start;width:280px;max-height:calc(100vh - 40px);overflow:auto;border-radius:22px;padding:18px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#E6F5EC;scrollbar-width:thin}
.presenter h3{margin:0 0 2px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9FD3B6}
.presenter .sub{font-size:12px;color:#8DB6A0;margin-bottom:14px}
.presenter .grp{margin:14px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7FB197}
.presenter .langs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presenter .pbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:start;padding:9px 11px;border-radius:12px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#EAF7F0;margin-bottom:6px;transition:background .15s}
.presenter .pbtn:hover{background:rgba(255,255,255,.14)}
.presenter .pbtn.on{background:var(--g600);border-color:var(--g500)}
.presenter .langs .pbtn{justify-content:center;padding:8px 4px;margin:0;font-size:12.5px}
.presenter .pbtn .n{font-size:11px;opacity:.7;margin-inline-start:auto}
.presenter .pin-hint{margin-top:12px;font-size:12px;color:#BFE3CF;background:rgba(200,150,62,.16);border:1px solid rgba(200,150,62,.35);padding:9px 11px;border-radius:12px}
.presenter .pin-hint b{font-family:var(--f-num);letter-spacing:.15em;color:#fff}

/* ---------- App shell ---------- */
.app{font-family:var(--f-ui)}
.app[lang="ar"]{--f-ui:"IBM Plex Sans Arabic","Plus Jakarta Sans",sans-serif}
.app[lang="ur"]{--f-ui:"Noto Naskh Arabic","IBM Plex Sans Arabic",sans-serif}
.app[lang="bn"]{--f-ui:"Hind Siliguri","Plus Jakarta Sans",sans-serif}
.app[lang="hi"],.app[lang="ne"]{--f-ui:"Noto Sans Devanagari","Plus Jakarta Sans",sans-serif}
.app[lang="ml"]{--f-ui:"Noto Sans Malayalam","Plus Jakarta Sans",sans-serif}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:isolate}

.aurora{position:absolute;inset:-20%;z-index:-1;background:
  radial-gradient(40% 30% at 20% 15%, rgba(143,217,176,.55), transparent 70%),
  radial-gradient(35% 28% at 85% 25%, rgba(120,214,200,.40), transparent 70%),
  radial-gradient(45% 35% at 70% 85%, rgba(143,217,176,.45), transparent 70%),
  radial-gradient(30% 25% at 10% 75%, rgba(251,241,222,.7), transparent 70%), var(--mint2);
  animation:drift 22s ease-in-out infinite alternate}
.aurora::after{content:"";position:absolute;inset:0;background-image:var(--pattern-light);background-size:88px 88px;opacity:.55}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-4%,3%,0) rotate(3deg)}100%{transform:translate3d(3%,-2%,0) rotate(-2deg)}}

.statusbar{position:absolute;top:0;inset-inline:0;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 8px 40px;font:600 15px var(--f-latin);z-index:50;pointer-events:none;color:var(--ink)}
.statusbar.light{color:#fff}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.enter{animation:viewIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:56px 18px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.has-head{padding-top:112px}
.scroll.no-nav{padding-bottom:40px}

.head{position:absolute;top:0;inset-inline:0;z-index:20;padding:52px 14px 10px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(to bottom, rgba(245,251,248,.92), rgba(245,251,248,.70));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head h2{margin:0;font-size:17px;font-weight:700;flex:1;text-align:center;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 4px 14px -8px rgba(10,61,42,.3);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.dot-badge{position:absolute;top:8px;inset-inline-end:9px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid #fff}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* nav */
.nav{position:absolute;bottom:14px;inset-inline:14px;height:72px;border-radius:26px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-line);box-shadow:0 16px 40px -16px rgba(10,61,42,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);height:100%;justify-content:center;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--g700)}
.nav .fab{width:60px;height:60px;border-radius:22px;margin:-26px auto 0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--g500),var(--g700));box-shadow:0 12px 26px -8px rgba(19,115,75,.65), inset 0 1px 0 rgba(255,255,255,.4)}
.nav .fab svg{width:27px;height:27px}

/* ---------- Glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-line);border-radius:var(--r-lg);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.nav,.head,.sheet{background:#fff}}
.card{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.sec-title h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--g700);font-weight:600;font-size:13px;padding:8px 4px;min-height:36px}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px;color:var(--ink3)}
.h-lg{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{color:var(--ink2);line-height:1.5;margin:6px 0 0;font-size:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;font-weight:700;font-size:16px;padding:0 18px;transition:transform .12s, box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn.primary{color:#fff;background:linear-gradient(145deg,var(--g500),var(--g700));box-shadow:0 14px 28px -12px rgba(19,115,75,.7), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.secondary{background:var(--glass-strong);border:1px solid rgba(19,115,75,.18);color:var(--g800)}
.btn.text{min-height:44px;color:var(--g700);font-size:14.5px}
.btn svg{width:20px;height:20px}
.cta-bar{position:absolute;bottom:0;inset-inline:0;padding:14px 18px 30px;z-index:25;background:linear-gradient(to top, rgba(245,251,248,.98) 60%, rgba(245,251,248,0));display:flex;flex-direction:column;gap:8px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--g100);color:var(--g800)}
.pill.sand{background:var(--sand-bg);color:var(--sand-ink)}
.pill.red{background:var(--danger-bg);color:var(--danger)}
.pill.amber{background:var(--warn-bg);color:var(--warn)}
.pill.glassw{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.pill svg{width:13px;height:13px}

/* balance card */
.balance{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;color:#fff;
  background:linear-gradient(135deg,#0A3D2A 0%,#0E5A3C 38%,#13734B 70%,#1F9A5C 100%);box-shadow:0 22px 40px -18px rgba(10,61,42,.75), inset 0 1px 0 rgba(255,255,255,.25)}
.balance::before{content:"";position:absolute;inset:0;background-image:var(--pattern-card);background-size:64px 64px;opacity:.5}
.balance::after{content:"";position:absolute;top:-60%;left:-40%;width:60%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(20deg);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.balance > *{position:relative;z-index:1}
.balance .wm{position:absolute;inset-inline-end:-24px;bottom:-30px;width:190px;opacity:.10;z-index:0}
.balance .lbl{font-size:13px;color:#BFE6D0;font-weight:500}
.balance .amt{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px}
.balance .amt small{font-size:15px;font-weight:600;color:#BFE6D0}
.balance .eye{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff}
.balance .eye svg{width:20px;height:20px}
.balance .safe{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#CDEBDB;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.balance .safe svg{width:15px;height:15px;flex:none}

.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;font-size:13px;font-weight:700;color:var(--ink);min-height:92px}
.act .ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--g500),var(--g700));box-shadow:0 10px 20px -10px rgba(19,115,75,.8), inset 0 1px 0 rgba(255,255,255,.35)}
.act .ic svg{width:23px;height:23px}

.family{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none}
.family::-webkit-scrollbar{display:none}
.fam{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-size:12px;font-weight:600;text-align:center}
.fam span:last-child{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--g800);background:linear-gradient(145deg,#fff,var(--g100));border:1px solid var(--glass-line);box-shadow:0 8px 18px -10px rgba(10,61,42,.4);position:relative}
.avatar .mini{position:absolute;bottom:-4px;inset-inline-end:-4px;width:22px;height:22px;border-radius:8px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;border:2px solid #fff}
.avatar.add{color:var(--g700);background:rgba(255,255,255,.5);border:1.5px dashed rgba(19,115,75,.35);box-shadow:none}
.avatar.add svg{width:22px;height:22px}

/* calculator */
.calc{padding:16px}
.calc .ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calc .ttl b{font-size:15px}
.fx{display:grid;gap:8px}
.fx-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.fx-row .cur{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;flex:none}
.fx-row .cur .flag{width:24px;height:24px}
.fx-row label{font-size:11.5px;color:var(--ink3);display:block}
.fx-row input,.fx-row .val{border:0;background:transparent;width:100%;font:800 20px var(--f-num);color:var(--ink);padding:2px 0;outline:none;min-width:0}
.fx-row .grow{flex:1;min-width:0}
.fx-swap{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink2);padding:0 6px}
.flag{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:8px 2px;border-radius:14px;line-height:1.2;text-align:center;min-height:80px}
.qa .qi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--mint);color:var(--g700);border:1px solid rgba(19,115,75,.08)}
.qa .qi svg{width:22px;height:22px}

/* offers */
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;scrollbar-width:none}
.offers::-webkit-scrollbar{display:none}
.offer{flex:none;width:272px;min-height:118px;border-radius:22px;padding:16px;scroll-snap-align:start;position:relative;overflow:hidden;text-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.offer.o1{background:linear-gradient(135deg,#FBF1DE,#F3D9A6);color:#5B3A08}
.offer.o2{background:linear-gradient(135deg,#0E5A3C,#1F9A5C);color:#fff}
.offer.o3{background:linear-gradient(135deg,#E6F6F1,#BFE9D8);color:var(--g900)}
.offer.o4{background:linear-gradient(135deg,#1b3b33,#2b5f4f);color:#fff}
.offer b{font-size:16px;line-height:1.25;display:block}
.offer p{margin:4px 0 0;font-size:12.5px;opacity:.85}
.offer .art{position:absolute;inset-inline-end:-10px;bottom:-14px;width:96px;height:96px;opacity:.22}

/* lists */
.list{padding:4px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;width:100%;text-align:start}
.li + .li{border-top:1px solid var(--line)}
.li .lic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--mint);color:var(--g700);flex:none}
.li .lic svg{width:20px;height:20px}
.li .lic.out{background:#F1F4F2;color:var(--ink2)}
.li .lic.red{background:var(--danger-bg);color:var(--danger)}
.li .lic.sand{background:var(--sand-bg);color:var(--sand-ink)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:end;flex:none}
.li .rt b{display:block;font-size:14.5px;font-weight:700}
.li .rt .pos{color:var(--g700)}
.li .chev{width:18px;height:18px;color:var(--ink3);flex:none}
.again{margin-top:4px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--g700);background:var(--g100);padding:6px 10px;border-radius:999px;min-height:30px}
.again svg{width:13px;height:13px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass-strong);border:1px solid var(--line);min-height:40px}
.chip.on{background:var(--g700);color:#fff;border-color:var(--g700)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.input{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.85);border:1.5px solid var(--line);transition:border .15s}
.input:focus-within{border-color:var(--g500);box-shadow:0 0 0 4px rgba(45,179,110,.14)}
.input input,.input select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;font-weight:600;height:50px}
.input .pre{font-weight:700;color:var(--ink2);font-family:var(--f-num)}
.input svg{width:20px;height:20px;color:var(--ink3)}
.err{color:var(--danger);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.err svg{width:16px;height:16px;flex:none;margin-top:1px}

.amount-hero{text-align:center;padding:18px 10px 8px}
.amount-hero .ain{display:flex;align-items:baseline;justify-content:center;gap:8px;direction:ltr}
.amount-hero .ain span{font:700 20px var(--f-num);color:var(--ink2)}
.amount-hero input{width:200px;text-align:center;border:0;background:transparent;outline:none;font:800 44px var(--f-num);color:var(--ink);letter-spacing:-.02em}
.quick-amts{display:flex;justify-content:center;gap:8px;margin-top:6px;direction:ltr}

.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;font-size:14px}
.kv + .kv{border-top:1px dashed var(--line)}
.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:700;text-align:end}
.kv.total b{font-size:17px}
.kv.big b{font-size:18px;color:var(--g700)}
.strike{text-decoration:line-through;color:var(--ink3);font-weight:500;margin-inline-end:6px}

.lock{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--sand-ink);background:var(--sand-bg);padding:10px 12px;border-radius:14px}
.lock svg{width:16px;height:16px;flex:none}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink2);padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.note svg{width:18px;height:18px;flex:none;color:var(--g700);margin-top:1px}

/* option tiles */
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;width:100%;text-align:start;background:var(--glass-strong);border:1.5px solid transparent;box-shadow:0 6px 18px -12px rgba(10,61,42,.3);min-height:70px}
.opt.on{border-color:var(--g500);background:#fff}
.opt .ol{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:13px}
.opt .ol svg{width:22px;height:22px}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:15px}
.opt .ot span{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.opt .tag{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(5,38,26,.38);z-index:80;opacity:0;animation:fade .2s forwards}
@keyframes fade{to{opacity:1}}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:90;max-height:86%;overflow:auto;border-radius:30px 30px 0 0;padding:10px 18px 30px;
  background:rgba(250,253,251,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -20px 50px -20px rgba(5,38,26,.5);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(15,42,32,.18);margin:0 auto 14px}
.sheet h3{margin:4px 0 6px;font-size:19px;letter-spacing:-.01em}
.sheet .sic{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;margin:4px 0 12px;background:var(--g100);color:var(--g700)}
.sheet .sic svg{width:28px;height:28px}
.sheet .sic.warn{background:var(--warn-bg);color:var(--warn)}
.sheet .sic.red{background:var(--danger-bg);color:var(--danger)}
.toast{position:absolute;top:58px;inset-inline:14px;z-index:100;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(10,61,42,.92);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 16px 30px -12px rgba(5,38,26,.6);animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.toast svg{width:20px;height:20px;flex:none;color:var(--g300)}
.toast .tt{flex:1;min-width:0}
.toast .tt span{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:1px}
@keyframes tin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

/* pin */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:26px 0 10px;direction:ltr}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--g600);transition:.15s}
.pin-dots i.f{background:var(--g600);transform:scale(1.05)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 26px;direction:ltr}
.pad button{height:64px;border-radius:22px;font:700 24px var(--f-num);background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 6px 16px -12px rgba(10,61,42,.4);display:grid;place-items:center}
.pad button svg{width:26px;height:26px}
.pad button.blank{background:transparent;border:0;box-shadow:none}

/* success */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px}
.tick{width:108px;height:108px;border-radius:38px;display:grid;place-items:center;background:linear-gradient(145deg,var(--g500),var(--g700));box-shadow:0 24px 40px -16px rgba(19,115,75,.8);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.tick svg{width:56px;height:56px}
.tick path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
canvas.confetti{position:absolute;inset:0;pointer-events:none;z-index:70}

/* timeline */
.tl{position:relative;padding-inline-start:30px}
.tl .st{position:relative;padding:4px 0 16px}
.tl .st::before{content:"";position:absolute;inset-inline-start:-21px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--g500)}
.tl .st .b{position:absolute;inset-inline-start:-30px;top:4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line)}
.tl .st.done .b{background:var(--g600);border-color:var(--g600);color:#fff}
.tl .st.now .b{border-color:var(--g500);box-shadow:0 0 0 5px rgba(45,179,110,.18)}
.tl .st.now .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--g500);animation:pulse 1.2s infinite}
.tl .st.fail .b{background:var(--danger);border-color:var(--danger);color:#fff}
.tl .st .b svg{width:12px;height:12px}
.tl .st b{font-size:14px;display:block}
.tl .st span{font-size:12px;color:var(--ink3)}
@keyframes pulse{50%{transform:scale(.5);opacity:.5}}

/* onboarding */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(80% 60% at 50% 40%, #fff, var(--mint) 70%)}
.splash .logo-full{width:270px;animation:pop .8s cubic-bezier(.2,1.2,.4,1)}
.splash .tag{font-size:12px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;animation:fade 1s .6s both;opacity:0}
.splash .loader{width:120px;height:4px;border-radius:2px;background:var(--g100);overflow:hidden;margin-top:30px}
.splash .loader i{display:block;height:100%;width:40%;border-radius:2px;background:var(--g600);animation:load 1.4s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-tile{padding:16px 14px;border-radius:20px;text-align:start;background:var(--glass-strong);border:1.5px solid var(--glass-line);box-shadow:0 8px 20px -14px rgba(10,61,42,.35);min-height:76px}
.lang-tile b{display:block;font-size:19px;line-height:1.3}
.lang-tile span{font-size:12px;color:var(--ink3)}
.lang-tile.on{border-color:var(--g500);background:#fff;box-shadow:0 0 0 4px rgba(45,179,110,.14)}
.hero-mark{width:64px;height:64px;margin-bottom:10px}
.scanbox{position:relative;height:250px;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#0b2a1f,#123f2f);display:grid;place-items:center}
.scanbox .qid{width:250px;height:156px;border-radius:14px;background:linear-gradient(135deg,#f6f2e6,#e8efe9);box-shadow:0 20px 40px -10px rgba(0,0,0,.5);position:relative;padding:14px;color:#3a4a42;font-size:9px;overflow:hidden}
.scanbox .corner{position:absolute;width:34px;height:34px;border:4px solid var(--g300)}
.scanbox .c1{top:30px;left:30px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.scanbox .c2{top:30px;right:30px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scanbox .c3{bottom:30px;left:30px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.scanbox .c4{bottom:30px;right:30px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanbox .beam{position:absolute;left:24px;right:24px;height:3px;background:linear-gradient(90deg,transparent,var(--g300),transparent);box-shadow:0 0 18px var(--g300);animation:beam 1.6s ease-in-out infinite}
@keyframes beam{0%{top:34px}50%{top:212px}100%{top:34px}}
.scanbox .ok{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px;white-space:nowrap}
.face{position:relative;width:220px;height:220px;margin:10px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%, #fff, var(--g100))}
.face svg.ring{position:absolute;inset:-10px;width:240px;height:240px;transform:rotate(-90deg)}
.face svg.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.face .who{width:120px;height:120px;color:var(--g700);opacity:.85}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--g100)}
.steps i.on{background:var(--g600)}

.qr{width:220px;height:220px;padding:14px;border-radius:24px;background:#fff;margin:0 auto;box-shadow:var(--shadow)}
.viewfinder{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, #2b3a33, #0b120f);display:flex;flex-direction:column;align-items:center;justify-content:center}
.viewfinder .vf{position:relative;width:240px;height:240px;border-radius:30px}
.viewfinder .vf::before{content:"";position:absolute;inset:0;border-radius:30px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.viewfinder .poster{width:150px;height:150px;opacity:.8;border-radius:12px;background:#fff;padding:10px;position:absolute;left:45px;top:45px}

.map{position:relative;height:290px;border-radius:24px;overflow:hidden;background:#dff1e8}
.map > svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.pinbtn{position:absolute;transform:translate(-50%,-100%);width:44px;height:52px;display:grid;place-items:start center}
.pinbtn svg{width:34px;height:42px;filter:drop-shadow(0 6px 8px rgba(10,61,42,.35))}
.pinbtn.on svg{transform:scale(1.2)}

.bar{height:8px;border-radius:5px;background:var(--g100);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--g500),var(--g700))}
.toggle{width:52px;height:32px;border-radius:999px;background:#cfd8d3;position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--g600)}
.toggle.on::after{inset-inline-start:23px}

.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:11px 14px;border-radius:20px;font-size:14px;line-height:1.45}
.bub.bot{background:#fff;border:1px solid var(--line);border-end-start-radius:6px;align-self:flex-start}
.bub.me{background:var(--g700);color:#fff;border-end-end-radius:6px;align-self:flex-end}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:15px 14px;font-weight:650;font-size:14px;text-align:start;min-height:52px}
.acc button svg{width:18px;height:18px;transition:.2s;flex:none}
.acc.open button svg{transform:rotate(90deg)}
.acc .ans{display:none;padding:0 14px 14px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.acc.open .ans{display:block}

.hint-on [data-hint]{position:relative}
.hint-on [data-hint]::after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:14px;height:14px;border-radius:50%;background:var(--sand);box-shadow:0 0 0 0 rgba(200,150,62,.6);animation:ring 1.4s infinite;z-index:5;pointer-events:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(200,150,62,.6)}100%{box-shadow:0 0 0 14px rgba(200,150,62,0)}}
.demo-ribbon{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9.5px;letter-spacing:.08em;color:var(--ink3);z-index:35;white-space:nowrap;pointer-events:none;opacity:.8}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- Phone / narrow screens: app goes full-screen ---------- */
@media (max-width: 899px){
  .stage{display:block;padding:0;background:var(--mint2)}
  .stage::before,.story,.presenter{display:none}
  .phone-wrap{position:fixed;inset:0;width:100%;height:100%;transform:none!important}
  .phone{position:absolute;inset:0;border-radius:0;padding:0;background:none;box-shadow:none}
  .phone .island{display:none}
  .app{width:100%;height:100%;border-radius:0}
  .statusbar{display:none}
  .scroll{padding-top:max(18px, env(safe-area-inset-top,0px))}
  .scroll.has-head{padding-top:calc(76px + env(safe-area-inset-top,0px))}
  .head{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .toast{top:calc(14px + env(safe-area-inset-top,0px))}
  .nav{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .cta-bar{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (min-width: 900px) and (max-width: 1180px){
  .stage{grid-template-columns:auto auto;justify-content:center}
  .story{display:none}
}

/* ---------- Guided demo ---------- */
.ptabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.22);margin-bottom:14px}
.ptabs button{padding:9px 6px;border-radius:11px;font-size:13px;font-weight:600;color:#A9CDB9}
.ptabs button.on{background:rgba(255,255,255,.14);color:#fff}
.gcard{border-radius:18px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16)}
.gcard.end{border-color:rgba(200,150,62,.55);background:linear-gradient(160deg,rgba(200,150,62,.20),rgba(255,255,255,.04))}
.gcard .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#9FD3B6}
.gcard h4{margin:4px 0 10px;font-size:19px;color:#fff;letter-spacing:-.01em}
.gcard .who{font-size:12px;color:#8DB6A0;margin-top:10px}
.gcard .say{font-size:15px;line-height:1.5;color:#F2FBF6;margin:6px 0 14px;min-height:68px}
.gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g500),var(--sand));border-radius:3px;transition:width .4s}
.grow2{display:flex;gap:8px}
.gnext{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 12px;border-radius:14px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(145deg,var(--g500),var(--g700));box-shadow:0 10px 22px -10px rgba(45,179,110,.8);text-align:center;line-height:1.2;width:100%}
.gnext svg,.gback svg{width:18px;height:18px;flex:none}
.gnext[disabled]{opacity:.6}
.gback{width:48px;min-height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);flex:none}
.kbd{font-size:11px;color:#7FB197;margin-top:10px;text-align:center}
.stepper{display:flex;flex-direction:column;gap:2px;margin:14px 0 4px}
.sp{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;font-size:13px;color:#A9CDB9;text-align:start}
.sp:hover{background:rgba(255,255,255,.06)}
.sp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid rgba(255,255,255,.25);flex:none}
.sp.done{color:#CFE8DA}.sp.done i{background:var(--g600);border-color:var(--g600);color:#fff}
.sp.now{color:#fff;background:rgba(255,255,255,.10);font-weight:600}.sp.now i{border-color:var(--sand);background:var(--sand);color:#2a1a00}
.jlist{display:flex;flex-direction:column;gap:6px}
.jrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;text-align:start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#DDF1E6}
.jrow:hover{background:rgba(255,255,255,.11)}
.jrow i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);flex:none}
.jrow b{display:block;font-size:13px;font-weight:600}
.jrow em{display:block;font-style:normal;font-size:11.5px;color:#8DB6A0;margin-top:1px}
.jrow.done i{background:var(--g600)}
.jrow.now{border-color:var(--sand);background:rgba(200,150,62,.14)}.jrow.now i{background:var(--sand);color:#2a1a00}

/* user-flow map (left column) */
.flow{margin-top:18px;display:flex;flex-direction:column}
.flow .fh{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FB197;margin-bottom:10px}
.fj{position:relative;display:flex;gap:12px;text-align:start;padding:7px 8px 13px;border-radius:12px;color:#CFE8DA}
.fj:hover{background:rgba(255,255,255,.05)}
.fj:not(:last-child)::after{content:"";position:absolute;inset-inline-start:21px;top:36px;bottom:-4px;width:2px;background:rgba(255,255,255,.14)}
.fj.done:not(:last-child)::after{background:var(--g500)}
.fn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;border:1.5px solid rgba(255,255,255,.3);background:var(--g950);position:relative;z-index:1}
.fj.done .fn{background:var(--g600);border-color:var(--g600);color:#fff}
.fj.now .fn{background:var(--sand);border-color:var(--sand);color:#2a1a00;box-shadow:0 0 0 5px rgba(200,150,62,.22)}
.ft{min-width:0;flex:1}
.ft b{display:block;font-size:14px;color:#fff;font-weight:650}
.ft em{display:block;font-style:normal;font-size:12px;color:#8DB6A0;margin-top:2px}
.fbar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--sand);transition:width .4s}
.story .by{margin-top:14px}

/* spotlight on the phone */
#spot{position:absolute;z-index:96;pointer-events:none;border-radius:18px;box-shadow:0 0 0 3px var(--sand),0 0 0 9px rgba(200,150,62,.28),0 0 0 2000px rgba(5,38,26,.22);transition:left .3s,top .3s,width .3s,height .3s;animation:spotP 1.6s ease-in-out infinite}
@keyframes spotP{50%{box-shadow:0 0 0 3px var(--sand),0 0 0 14px rgba(200,150,62,.12),0 0 0 2000px rgba(5,38,26,.22)}}
#spot .tap{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--sand);color:#2a1a00;font:800 11px var(--f-latin);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);white-space:nowrap}
#spot.below .tap{top:auto;bottom:-30px}

/* phone coach bar + launcher (only when there is no side panel) */
#coach{display:none}
@media (max-width: 1180px) and (min-width: 900px){ .presenter{width:300px} }

faq1:["How long does money take to reach Bangladesh?","كم يستغرق وصول المبلغ إلى بنغلاديش؟","বাংলাদেশে টাকা পৌঁছাতে কত সময় লাগে?","बांग्लादेश पैसे पहुँचने में कितना समय लगता है?","بنگلہ دیش رقم پہنچنے میں کتنا وقت لگتا ہے؟","बंगलादेश पैसा पुग्न कति समय लाग्छ?"],
faa1:["bKash, Nagad and Rocket usually arrive within minutes. Bank accounts the same day, cash pickup within an hour.","تصل تحويلات bKash وNagad وRocket عادة خلال دقائق، والحسابات البنكية في نفس اليوم، والاستلام النقدي خلال ساعة.","বিকাশ, নগদ ও রকেটে সাধারণত কয়েক মিনিটে, ব্যাংকে একই দিনে, ক্যাশ পিকআপে এক ঘণ্টায় পৌঁছায়।","bKash, Nagad और Rocket में आमतौर पर कुछ मिनट, बैंक खाते में उसी दिन, नकद पिकअप एक घंटे में।","bKash، Nagad اور Rocket میں عموماً چند منٹ، بینک میں اسی دن، کیش پک اپ ایک گھنٹے میں۔","bKash, Nagad र Rocket मा प्रायः केही मिनेट, बैंकमा सोही दिन, नगद संकलन एक घण्टाभित्र।"],
faq2:["Is my money safe in the wallet?","هل أموالي آمنة في المحفظة؟","ওয়ালেটে কি আমার টাকা নিরাপদ?","क्या वॉलेट में मेरा पैसा सुरक्षित है?","کیا والٹ میں میری رقم محفوظ ہے؟","के वालेटमा मेरो पैसा सुरक्षित छ?"],
faa2:["Yes. Every riyal is held in a safeguarding account at a QCB-approved bank, separate from AEC’s own money.","نعم. يُحفظ كل ريال في حساب حماية لدى بنك معتمد ومنفصل عن أموال الشركة.","হ্যাঁ। প্রতিটি রিয়াল QCB-অনুমোদিত ব্যাংকে আলাদা সুরক্ষা অ্যাকাউন্টে রাখা হয়।","हाँ। हर रियाल QCB-स्वीकृत बैंक में AEC के पैसे से अलग सुरक्षा खाते में रखा जाता है।","جی ہاں۔ ہر ریال QCB سے منظور شدہ بینک میں AEC کی رقم سے الگ تحفظ اکاؤنٹ میں رکھا جاتا ہے۔","हो। हरेक रियाल QCB-स्वीकृत बैंकमा AEC को पैसाभन्दा छुट्टै सुरक्षा खातामा राखिन्छ।"],
faq3:["Can my salary come straight to the wallet?","هل يمكن أن يصل راتبي مباشرة إلى المحفظة؟","বেতন কি সরাসরি ওয়ালেটে আসতে পারে?","क्या वेतन सीधे वॉलेट में आ सकता है?","کیا تنخواہ سیدھی والٹ میں آ سکتی ہے؟","के तलब सिधै वालेटमा आउन सक्छ?"],
faa3:["Yes. Give your employer your wallet IBAN and your salary arrives through WPS on payday.","نعم. أعطِ جهة عملك رقم IBAN لمحفظتك ويصل راتبك عبر نظام حماية الأجور.","হ্যাঁ। নিয়োগকর্তাকে ওয়ালেট IBAN দিন, বেতনের দিন WPS-এ টাকা আসবে।","हाँ। नियोक्ता को वॉलेट IBAN दें, वेतन WPS से वेतन-दिवस पर आएगा।","جی ہاں۔ آجر کو والٹ IBAN دیں، تنخواہ WPS کے ذریعے آئے گی۔","हो। रोजगारदातालाई वालेट IBAN दिनुहोस्, तलब WPS मार्फत आउँछ।"],
faq4:["Where can I get cash?","أين يمكنني السحب نقداً؟","নগদ টাকা কোথায় পাব?","नकद कहाँ मिलेगा?","نقد کہاں ملے گا؟","नगद कहाँ पाइन्छ?"],
faa4:["At any AEC branch with a cash code from the app, or send it to your bank by Fawran.","من أي فرع للعربية برمز سحب من التطبيق، أو حوّله لبنكك عبر فوران.","অ্যাপের ক্যাশ কোড দিয়ে যেকোনো AEC শাখায়, বা ফাওরানে ব্যাংকে পাঠান।","ऐप के कैश कोड से किसी भी AEC शाखा में, या फ़वरान से बैंक में भेजें।","ایپ کے کیش کوڈ سے کسی بھی AEC برانچ میں، یا فوران سے بینک بھیجیں۔","एपको नगद कोडले कुनै पनि AEC शाखामा, वा फवरानबाट बैंकमा पठाउनुहोस्।"],

/* ---------- Formatting ---------- */
const fmt = (n, d = 2) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

const tfmt = iso => new Intl.DateTimeFormat(L().loc, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const nowIso = () => { const d = new Date(TODAY.getTime() + (Date.now() - BOOT)); return d.toISOString().slice(0, 16); };
const BOOT = Date.now();
const country = c => COUNTRIES.find(x => x.c === c);

}

function confetti() {

  const app = $('#app'); const c = document.createElement('canvas'); c.className = 'confetti';
  c.width = app.clientWidth * 2; c.height = app.clientHeight * 2; app.appendChild(c);
  const x = c.getContext('2d'); const cols = ['#1F9A5C', '#2DB36E', '#8FD9B0', '#C8963E', '#F3D9A6', '#ffffff'];
  const P = Array.from({ length: 70 }, () => ({ x: c.width / 2, y: c.height * .3, vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 6, s: 6 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] }));
  let f = 0; (function tick() {

    if (++f < 80) requestAnimationFrame(tick); else c.remove();

}

/* ---------- Fake QR ---------- */
function qrSvg(seed = 7, color = '#0A3D2A') {
  const n = 25; let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let cells = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.6" fill="${color}"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" rx="1" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".6" fill="${color}"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9) || (x > 9 && x < 15 && y > 9 && y < 15);
    if (!inF && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1" rx=".3" fill="${color}"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" shape-rendering="geometricPrecision">${cells}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}<rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1.2" fill="#1F9A5C"/><text x="12.5" y="13.7" text-anchor="middle" font-size="3" font-weight="800" font-style="italic" fill="#fff" font-family="Plus Jakarta Sans">ae</text></svg>`;
}

/* face inside an .avatar: uploaded photo → illustrated portrait → initials */
function face(b) {
  if (b.photo) return `<span class="ptw"><img class="pt" src="${b.photo}" alt=""></span>`;
  if (b.av && AV[b.av]) return `<span class="ptw">${portrait(AV[b.av])}</span>`;

}
function readPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const s = 192, c = document.createElement('canvas'); c.width = c.height = s; const k = Math.max(s / img.width, s / img.height); const w = img.width * k, h = img.height * k; c.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h); cb(c.toDataURL('image/jpeg', .86)); }; img.onerror = () => toast(t('photo_error'), '', 'alert'); img.src = r.result; };
  r.readAsDataURL(file);
}

function txnRow(x, withAgain) {

    remit: ['send', 'out', b ? b.name : '', `${methodName(x.m)} · ${dfmt(x.date)}`],
    salary: ['wallet', '', t('tx_salary'), `${x.from} · ${dfmt(x.date)}`],
    refund: ['refresh', '', t('tx_refund'), `${dfmt(x.date)}`],
    add: ['plus', '', t('tx_add'), `${x.via} · ${dfmt(x.date)}`],
    withdraw: ['cash', 'out', t('tx_withdraw'), `${x.branch} · ${dfmt(x.date)}`],
    bill: ['bill', 'out', x.biller, `${t('tx_bill')} · ${dfmt(x.date)}`],
    topup: ['phone', 'out', x.op, `${t('tx_topup')} · ${dfmt(x.date)}`],
    qr: ['qr', 'out', x.merchant, `${t('tx_qr')} · ${dfmt(x.date)}`],
    donate: ['heart', 'out', x.charity, `${t('tx_donate')} · ${dfmt(x.date)}`],
    local: ['swap', 'out', x.to, `${t('tx_local')} · ${dfmt(x.date)}`],
    gift: ['gift', 'out', x.brand, `${t('tx_gift')} · ${dfmt(x.date)}`],
    cashcode: ['cash', 'out', t('tx_cashcode'), `${x.branch} · ${dfmt(x.date)}`],
  }[x.type];
  const inflow = ['salary', 'refund', 'add'].includes(x.type);
  const st = x.status === 'failed' ? `<span class="pill red">${t('st_failed')}</span>` : x.status === 'processing' ? `<span class="pill amber">${t('st_processing')}</span>` : '';

  return `<button class="li" data-act="openTxn" data-arg="${x.id}"><span class="lic ${x.status === 'failed' ? 'red' : map[1]}">${ico(map[0])}</span>
    <span class="lt"><b>${esc(map[2])}</b><span>${esc(map[3])}</span>${withAgain && x.type === 'remit' && x.status !== 'failed' ? `<span class="again" data-act="sendAgain" data-arg="${x.id}" role="button" data-hint>${ico('refresh')} ${t('send_again')}</span>` : ''}</span>
    <span class="rt"><b class="${inflow ? 'pos' : ''}">${money(amt, 'QAR', '', inflow ? '+' : '−')}</b>${st}</span></button>`;
}

/* ---------- engine ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const inApp = sel => sel ? $('#app').querySelector(sel) : null;
async function waitFor(sel, ms = 5000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (inApp(sel)) return true; await sleep(100); } return false; }
const J = () => TOUR[TS.j];
const step = () => TS.on ? J().steps[TS.k] : null;
async function runStep(st, fast) {
  if (st.ready) await waitFor(st.ready, 5000);
  if (st.do) await st.do(); else { const el = inApp(st.t); if (el) el.click(); }
  await sleep(fast && !st.wait ? 250 : (st.wait || 450));
}
async function tourStart(j) {
  TS.on = true; TS.j = +j || 0; TS.k = 0; TS.busy = true; closeSheet(); paintTour();
  J().setup(); await sleep(450); TS.busy = false; paintTour();
}
async function tourNext() {
  if (!TS.on) return tourStart(0);
  if (TS.busy) return;
  const n = J().steps.length;
  if (TS.k >= n) { // journey complete → next journey
    if (!TS.done.includes(TS.j)) TS.done.push(TS.j);
    if (TS.j < TOUR.length - 1) return tourStart(TS.j + 1);
    TS.on = false; paintTour(); toast('Demo complete', 'All journeys shown', 'star'); return;
  }
  TS.busy = true; paintTour();
  await runStep(J().steps[TS.k]);
  TS.k++; TS.busy = false; if (TS.k >= n && !TS.done.includes(TS.j)) TS.done.push(TS.j); paintTour();
}
async function tourJump(k) {
  if (TS.busy) return; k = Math.max(0, +k);
  TS.busy = true; paintTour(); J().setup(); await sleep(450);
  for (let i = 0; i < k; i++) await runStep(J().steps[i], true);
  TS.k = k; TS.busy = false; paintTour();
}
const tourBack = () => { if (!TS.on) return; if (TS.k > 0) tourJump(TS.k - 1); else if (TS.j > 0) { tourStart(TS.j - 1); } };
const tourExit = () => { TS.on = false; TS.busy = false; paintTour(); };
ACT.tourStart = j => tourStart(j);
ACT.tourNext = () => tourNext();
ACT.tourBack = () => tourBack();
ACT.tourJump = k => tourJump(k);
ACT.tourExit = () => tourExit();
ACT.pTab = k => { TS.tab = k; paintPresenter(); };
ACT.tourMenu = () => openSheet(`<h3>Guided demo</h3><p class="lead" style="margin-bottom:12px">A day in Rahim’s life: 8 journeys, about 8 minutes. Tap <b>Next</b> and the guide taps for you, or tap the highlighted spot yourself.</p>
  <div class="glass list">${TOUR.map((x, i) => `<button class="li" data-act="tourStart" data-arg="${i}"><span class="lic">${i + 1}</span><span class="lt"><b>${x.title}</b><span>${x.path}</span></span>${ico('right', 'chev')}</button>`).join('')}</div>`);

/* user taps the highlighted target themselves → advance */
document.addEventListener('click', e => {
  const st = step(); if (!st || TS.busy || st.do || !e.target.closest('#app') || e.target.closest('.coach')) return;
  const el = inApp(st.t); if (!el || !el.contains(e.target)) return;
  TS.busy = true; setTimeout(() => { TS.k++; TS.busy = false; if (TS.k >= J().steps.length && !TS.done.includes(TS.j)) TS.done.push(TS.j); paintTour(); }, st.wait || 450);
}, true);
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if (typing && !(TS.on && ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp'].includes(e.key))) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { if (e.key === 'Enter' && !TS.on) return; e.preventDefault(); tourNext(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); tourBack(); }
  else if (e.key === 'Escape' && TS.on) tourExit();
});

/* ---------- spotlight ---------- */
function positionSpot() {
  const sp = $('#spot'); if (!sp) return;
  const st = step(); const el = st && !TS.busy && TS.k < J().steps.length ? inApp(st.t) : null;
  if (!el) { sp.hidden = true; return; }
  const app = $('#app'); const ar = app.getBoundingClientRect(); const sc = ar.width / app.offsetWidth || 1;
  const box = el.closest('.scroll'); let r = el.getBoundingClientRect();
  if (box) { const br = box.getBoundingClientRect(); if (r.top < br.top + 90 * sc || r.bottom > br.bottom - 110 * sc) { box.scrollTop += (r.top + r.height / 2 - (br.top + br.height * .45)) / sc; r = el.getBoundingClientRect(); } }
  const fam = el.closest('.family'); if (fam) { const fr = fam.getBoundingClientRect(); if (r.right > fr.right || r.left < fr.left) { fam.scrollLeft += (r.left - fr.left - 20) / sc; r = el.getBoundingClientRect(); } }
  const pad = 6; const rad = parseFloat(getComputedStyle(el).borderRadius) || 14;
  Object.assign(sp.style, { left: (r.left - ar.left) / sc - pad + 'px', top: (r.top - ar.top) / sc - pad + 'px', width: r.width / sc + pad * 2 + 'px', height: r.height / sc + pad * 2 + 'px', borderRadius: Math.min(rad + pad, 40) + 'px' });
  sp.classList.toggle('below', (r.top - ar.top) / sc < 150);
  sp.classList.toggle('look', !!st.do);
  sp.hidden = false;
}

  ${P('simSalary', null, 'wallet', 'WPS salary credit (QAR 1,800)')}
  ${P('simDeliver', null, 'check', 'Transfer delivered')}
  ${P('cycleTier', null, 'shield', 'Tier: ' + S.tier.charAt(0).toUpperCase() + S.tier.slice(1), '')}
  ${P('expireRate', null, 'clock', 'Expire rate lock')}
  ${P('netFail', null, 'wifi', 'Next payment times out', S.netFail ? 'on' : '')}
  ${P('hints', null, 'star', 'Tap hints', S.hints ? 'on' : '')}
  ${P('reset', null, 'refresh', 'Reset demo')}
  <div class="pin-hint">Demo PIN &amp; OTP <b>111111</b> · or tap Face ID</div>`;
}
function paintPresenter() { const p = $('.presenter'); if (p) p.innerHTML = panelHTML(); }
window.addEventListener('aec:render', paintPresenter);
ACT.pLang = k => { S.lang = k; render(); };
ACT.jump = j => {
  closeSheet();
  if (j !== 'onboard') S.loggedIn = true;
  if (j === 'onboard') { S.lang = 'en'; return go('kyc-intro'); }
  if (j === 'salary') { ACT.simSalary(); return go('home'); }
  if (j === 'again' || j === 'bills' && false) return go('home');
  if (j === 'bills') { S.ui.bt = 'qa'; return go('bills'); }
  if (j === 'qr') { S.lang = 'en'; return go('scan'); }
  if (j === 'branch') { S.ui.br = 'ind'; return go('branches'); }
  if (j === 'complaint') { S.ui.ctx = null; go('complaints'); return setTimeout(ACT.newComplaint, 350); }
};
ACT.simSalary = () => {
  const x = { id: 'n' + Date.now(), type: 'salary', date: nowIso(), amt: 1800, from: 'Al Noor Contracting W.L.L.', month: 'Nov 2026', status: 'done', ref: nextRef('WPS') };
  S.balance = r2(S.balance + 1800); S.txns.unshift(x);
  S.notifs.unshift({ id: 'ns' + Date.now(), k: 'n_salary', v: { amt: 'QAR 1,800.00', emp: 'Al Noor Contracting W.L.L.' }, date: nowIso(), read: false });
  if (S.loggedIn) render();
  setTimeout(() => toast(t('n_salary_t'), t('n_salary', { amt: 'QAR 1,800.00', emp: 'Al Noor Contracting W.L.L.' }), 'wallet'), 200);
};
ACT.simDeliver = () => { const x = S.txns.find(x => x.type === 'remit' && x.status === 'processing'); if (x) deliver(x.id); else toast('No transfer in progress', 'Send one first', 'info'); };
ACT.cycleTier = () => { S.tier = { basic: 'standard', standard: 'full', full: 'basic' }[S.tier]; render(); toast(t('tier_' + S.tier), '', 'shield'); };
ACT.expireRate = () => { S.lockAt = Date.now() - 1; if (['send-amount', 'send-review'].includes(current)) rateExpired(); else toast('Rate lock expired', 'Open a transfer to see the refresh', 'clock'); };
ACT.netFail = () => { S.netFail = !S.netFail; paintPresenter(); };
ACT.hints = () => { S.hints = !S.hints; $('#app').classList.toggle('hint-on', S.hints); paintPresenter(); };
ACT.reset = () => { TS.on = false; TS.done = []; S = seedState(); S.lang = 'en'; clearTimeout(window._dlv); $('#app').classList.remove('hint-on'); go('splash'); };

function fitPhone() {
  const w = $('.phone-wrap'); if (!w) return;
  if (innerWidth < 900) { w.style.transform = ''; return; }
  const s = Math.min(1, (innerHeight - 30) / (868 + 110)); w.style.transform = `translateY(${-55 * s}px) scale(${s})`;
}
function boot() {
  buildDict();
  const host = document.createElement('div'); host.id = 'stage-host'; document.body.appendChild(host);
  host.innerHTML = `<div class="stage">${dreamMarkup()}
    <aside class="story">${logoFull('#FFFFFF', '#A9CDB9')}<h1>The AEC Wallet</h1><p>A QCB-licensed wallet for the people who keep Qatar running. Click any journey to start it.</p><div id="flowmap"></div>
      <div class="by">Clickable prototype · BRAC IT Services · Nov 2026<br>Illustrative data and indicative rates</div></aside>
    <div class="phone-wrap"><div class="phone"><div class="island"></div><div class="app" id="app"><div class="aurora"><i></i><i></i><i></i><i></i></div>
      <div class="statusbar" id="statusbar"><span class="num">9:41</span><span class="sb-r">${ico('signal').replace('<svg', '<svg style="width:18px;height:18px"')}${ico('wifi').replace('<svg', '<svg style="width:18px;height:18px"')}${ico('battery').replace('<svg', '<svg style="width:24px;height:24px"')}</span></div>
      <div id="view"></div><div id="spot" hidden><span class="tap">Tap</span></div><div id="overlay"></div><div id="toast"></div><div id="coach"></div></div></div><div class="demo-bar" id="demobar" aria-label="Demo navigation"></div></div>
    <aside class="presenter" aria-label="Presenter controls"></aside></div>`;
  fitPhone(); addEventListener('resize', fitPhone);
  dreamStart();
  const h = location.hash.slice(1);
  if (h && SCREENS[h] && !['splash', 'language', 'login', 'otp', 'pin-login'].includes(h) && !h.startsWith('kyc')) S.loggedIn = true;
  TS.on = !location.hash || location.hash === '#splash'; TS.j = 0; TS.k = 0;
  render(); paintTour();
  new MutationObserver(spotSoon).observe($('#app'), { childList: true, subtree: true });
  $('#app').addEventListener('scroll', spotSoon, true); addEventListener('resize', spotSoon);
  setInterval(() => {
    $$('[data-lock]').forEach(el => el.textContent = mmss(lockLeft()));
    if (lockLeft() <= 0 && S.lockAt && ['send-amount', 'send-review'].includes(current) && !$('#overlay .sheet')) { S.lockAt = 0; rateExpired(); }
  }, 1000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
